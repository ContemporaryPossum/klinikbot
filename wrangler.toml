# Cloudflare Workers config — free tier is enough for a clinic.
# Deploy: `npx wrangler deploy` (or connect the GitHub repo in the Cloudflare dashboard → Workers → Create → Import repository).
name = "klinikbot"
main = "src/worker.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
# Keep variables added in the dashboard when deploying from GitHub (otherwise each deploy deletes them).
keep_vars = true

# Serves public/ (the demo page) as static files
[assets]
directory = "./public"
binding = "ASSETS"

# One Durable Object per clinic holds its SQLite database (free plan supports SQLite-backed DOs)
[[durable_objects.bindings]]
name = "CLINIC_DO"
class_name = "ClinicDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClinicDO"]

# Reminder scheduler: every minute
[triggers]
crons = ["* * * * *"]

# Plain (non-secret) variables. Anything secret — WHATSAPP_TOKEN, ANTHROPIC_API_KEY, WHATSAPP_VERIFY_TOKEN, INTERNAL_TOKEN —
# must be added in the dashboard as type **Secret** (Settings → Variables & Secrets → Add → Secret) or with
# `npx wrangler secret put NAME`. Secrets survive deploys; plain "Text" variables added in the dashboard only survive
# because of keep_vars above.
[vars]
CLINIC = "demo-dental"
WHATSAPP_TEMPLATE_REMINDER_24H = "appt_reminder_24h"
WHATSAPP_TEMPLATE_REMINDER_2H = "appt_reminder_2h"
WHATSAPP_PHONE_NUMBER_ID = "1477727868747103"
WHATSAPP_WABA_ID = "1806226397249265"

[observability]
enabled = true
